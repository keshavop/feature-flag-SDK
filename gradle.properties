org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

kotlin.code.style=official
# iOS targets can only be built on macOS hosts; skip them elsewhere instead of failing
kotlin.native.ignoreDisabledTargets=true

# Coordinates, overridden at release time with -PVERSION_NAME=<tag>
GROUP=io.github.keshavop
VERSION_NAME=0.1.0-SNAPSHOT

POM_NAME=Feature Flag SDK
POM_DESCRIPTION=Universal feature flag SDK for Web, Android, iOS and Kotlin backends
POM_URL=https://github.com/keshavop/feature-flag-SDK
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_SCM_URL=https://github.com/keshavop/feature-flag-SDK
POM_SCM_CONNECTION=scm:git:https://github.com/keshavop/feature-flag-SDK.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/keshavop/feature-flag-SDK.git
POM_DEVELOPER_ID=keshavop
POM_DEVELOPER_NAME=keshavop
POM_DEVELOPER_URL=https://github.com/keshavop
