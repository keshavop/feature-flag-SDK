# Deletes a PR's branch once the PR is merged. Skips the default branch, branches
# from forks, and branches another open PR still targets (deleting those would
# close the stacked PR).
name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          dependents=$(gh pr list --repo "$REPO" --state open --base "$BRANCH" --json number --jq 'length')
          if [ "$dependents" -gt 0 ]; then
            echo "Keeping $BRANCH: $dependents open PR(s) target it."
            exit 0
          fi
          if gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH"; then
            echo "Deleted $BRANCH."
          else
            echo "Could not delete $BRANCH (already gone or protected)."
          fi
