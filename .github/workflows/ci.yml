name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, API check, JVM + JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Assemble npm package
        run: ./gradlew :ff-web:prepareNpmPackage
      - name: Check npm package contents
        working-directory: ff-web/build/npm
        run: npm pack --dry-run
      - name: Browser smoke test (Chromium)
        run: |
          npm install --no-save --no-package-lock --prefix ff-web/e2e playwright@1.63.0
          npx --prefix ff-web/e2e playwright install --with-deps chromium
          node ff-web/e2e/smoke.mjs
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/"

  ios:
    name: iOS simulator tests
    runs-on: macos-latest
    env:
      # the Android module is covered by the Linux job
      ANDROID_HOME: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test
      - name: Link the iOS framework
        run: ./gradlew :ff-ios:linkDebugFrameworkIosSimulatorArm64
